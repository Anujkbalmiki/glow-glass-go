services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: :8080
      PF_ENABLED: ${PF_ENABLED:-false}
      ESI_ENABLED: ${ESI_ENABLED:-false}
      PROFESSIONAL_TAX_ENABLED: ${PROFESSIONAL_TAX_ENABLED:-false}
      TDS_ENABLED: ${TDS_ENABLED:-false}
